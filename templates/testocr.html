<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Pipeline Test</title>
<style>
  :root { --bg:#0f1216; --panel:#171c23; --line:#2a333f; --text:#dfe6ee; --accent:#4da3ff; }
  * { box-sizing: border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; margin:0; display:flex; height:100vh; overflow:hidden; }
  .sidebar { width:190px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .thumb { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:4px; cursor:pointer; border:2px solid transparent; display:block; }
  .thumb.active { border-color:var(--accent); }
  .main { flex:1; display:flex; flex-direction:column; padding:12px; overflow:hidden; min-width:0; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .result-panel { font-size:14px; font-weight:bold; margin-bottom:4px; }
  .conf-row { font-size:12px; margin-bottom:6px; display:flex; flex-wrap:wrap; gap:4px; min-height:24px; }
  .canvas-wrap { flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#070a0d; border-radius:8px; }
  canvas { max-width:100%; max-height:100%; display:block; }
  .eval-panel { width:400px; flex-shrink:0; background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .eval-section { background:#1e252e; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .eval-section > b { font-size:12px; display:block; margin-bottom:8px; }
  .digit-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(115px, 1fr)); gap:6px; }
  .digit-card { background:#2a333f; border:1px solid #3c495a; border-radius:6px; padding:6px; text-align:center; transition:border-color 0.2s; }
  .digit-card .pred { font-size:24px; color:var(--accent); font-weight:bold; line-height:1; margin:2px 0; }
  .digit-card input[type=text] { width:42px; padding:2px 4px; text-align:center; font-size:18px; font-weight:bold; background:#0f1216; color:#37c978; border:1px solid #37c978; border-radius:4px; margin:3px auto; display:block; }
  .digit-card label { display:block; font-size:10px; color:#ffb340; cursor:pointer; }
  button { background:#33415a; color:white; border:none; padding:7px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:13px; }
  button:hover { background:var(--accent); }
  .btn-save { background:#1a5a3a; color:white; width:100%; padding:10px; font-size:14px; border-radius:6px; }
  .btn-save:hover { background:#37c978; color:#0f1216; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main">
  <div class="toolbar">
    <div style="display:flex; align-items:center; gap:10px;">
      <h3 style="margin:0;font-size:15px;">🔍 Test Pipeline (Full OCR)</h3>
      <select id="batch-select" onchange="changeBatch(this.value)" style="background:#161b22; color:#58a6ff; border:1px solid #30363d; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:12px; cursor:pointer;">
        <option value="2">⚡ Validate 2 (50 ảnh mới)</option>
        <option value="1">⚙️ Validate 1 (48 ảnh cũ)</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <a href="/validate1" style="background:#1f6feb; color:#fff; text-decoration:none; padding:5px 10px; border-radius:4px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; margin-right:6px;">🛠️ Sửa Validate 1</a>
      <div style="background:#1e252e; border:1px solid #3c495a; padding:2px 6px; border-radius:4px; display:flex; align-items:center; font-size:12px; height: 28px;">
        <span style="color:#8b98a8; margin-right:4px;">Elec Slices:</span>
        <input type="number" id="slice-count-input" value="6" min="4" max="9" style="width:32px; background:#0f1216; color:white; border:none; text-align:center;">
      </div>
      <button onclick="prevImage()">◀</button>
      <button onclick="nextImage()">▶</button>
      <label style="color:#ffb340; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; margin-left:6px; cursor:pointer;" title="Chỉ đánh giá công tơ cơ, tự động bỏ qua công tơ điện tử">
        <input type="checkbox" id="skip-elec" checked onchange="onToggleSkipElec()"> ⚙️ Bỏ qua điện tử
      </label>
      <button onclick="runInference()" style="background:#1a5a3a; margin-left:6px;">🚀 Detect</button>
      <button onclick="showBatchStats()" style="background:#1f6feb; color:#fff;" title="Xem thống kê tổng quan độ chính xác của Batch">📊 Thống kê</button>
      <button onclick="clearBatchEvals()" style="background:#5a1a1a; color:#ff9999; border:none; padding:5px 8px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;" title="Xóa toàn bộ đánh giá của batch này để chấm lại từ đầu">🗑️ Xóa đánh giá batch</button>
      <button onclick="clearResults()" style="background:#2a333f; color:#8b98a8;">🧹 Xóa vẽ</button>
    </div>
  </div>
  <div class="result-panel" id="result-text" style="color:var(--accent)">—</div>
  <div class="conf-row" id="conf-row"></div>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="eval-panel" id="eval-panel" style="display:none;">

  <div class="eval-section">
    <b style="color:#4da3ff;">🏷️ Phân loại ảnh</b>
    <label style="display:block;margin-bottom:4px;"><input type="radio" name="eval-type" value="mechanical" checked> ⚙️ Công tơ cơ</label>
    <label style="display:block;margin-bottom:4px;"><input type="radio" name="eval-type" value="electronic"> ⚡ Công tơ điện tử</label>
    <label style="display:block;"><input type="radio" name="eval-type" value="other"> ❌ Rác / Bỏ qua</label>
  </div>

  <div class="eval-section">
    <b style="color:#4da3ff;">✅ Model Detect</b>
    <label style="display:block;margin-bottom:4px;"><input type="checkbox" id="eval-obb" checked> OBB tìm đúng màn hình</label>
    <label style="display:block;"><input type="checkbox" id="eval-digits" checked onchange="toggleBboxMiss()"> BBox đủ số lượng digit</label>
    <div id="bbox-miss-panel" style="display:none; margin-top:8px; padding:8px; background:#2a1a1a; border-radius:4px; border:1px solid #5a2a2a;">
      <div style="font-size:12px; color:#ffb340; margin-bottom:6px;">⚠️ Lý do thiếu digit:</div>
      <label style="display:block; margin-bottom:3px; font-size:12px;"><input type="radio" name="miss-reason" value="half_digit_not_trained" checked> 🔄 Half-digit chưa được train</label>
      <label style="display:block; margin-bottom:3px; font-size:12px;"><input type="radio" name="miss-reason" value="blurry_occluded"> 🌫️ Digit bị mờ / bị che</label>
      <label style="display:block; margin-bottom:3px; font-size:12px;"><input type="radio" name="miss-reason" value="out_of_frame"> ✂️ Digit nằm ngoài khung OBB</label>
      <label style="display:block; font-size:12px;"><input type="radio" name="miss-reason" value="other"> ❓ Khác</label>
      <div style="margin-top:6px; font-size:12px; color:#8b98a8;">
        Dự kiến: <input type="number" id="expected-digit-count" min="1" max="9" value="6" style="width:40px; padding:2px 4px; background:#0f1216; color:white; border:1px solid #5a2a2a; border-radius:3px;"> chữ số &nbsp;|&nbsp; Phát hiện được: <span id="detected-count" style="color:#ff5c5c; font-weight:bold;">0</span>
      </div>
    </div>
  </div>

  <div class="eval-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <b style="color:#37c978; margin:0;">🎯 OCR, Số đỏ & Mid-roll</b>
      <div id="live-eval-summary" style="font-size:11px; color:#8b98a8; font-weight:bold;"></div>
    </div>
    <div class="digit-cards" id="digit-eval-container"></div>
  </div>

  <div>
    <button class="btn-save" onclick="saveEvaluation()">💾 Lưu đánh giá → Next</button>
    <div id="eval-status" style="text-align:center;margin-top:8px;font-weight:bold;font-size:13px;"></div>
  </div>

</div>

<!-- Modal Thống Kê Batch -->
<div id="stats-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#171c23; border:1px solid #3c495a; border-radius:8px; width:540px; max-width:92%; max-height:85vh; overflow-y:auto; padding:20px; color:#dfe6ee; box-shadow:0 8px 32px rgba(0,0,0,0.85);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid #2a333f; padding-bottom:10px;">
      <h3 style="margin:0; font-size:16px; color:#4da3ff;">📊 Thống kê Độ chính xác Batch</h3>
      <button onclick="closeStatsModal()" style="background:transparent; border:none; color:#8b98a8; font-size:18px; cursor:pointer; padding:0 4px;">✕</button>
    </div>
    <div id="stats-modal-body">Đang tải dữ liệu...</div>
  </div>
</div>

<script>
let images = [];
let currentIdx = -1;
let currentImgObj = null;
let savedEvals = {};
let imageClassMap = {};
let currentInferDigits = [];
const urlParams = new URLSearchParams(window.location.search);
let currentBatch = urlParams.get('batch') || "2";

function changeBatch(b) {
  currentBatch = b;
  const newUrl = new URL(window.location);
  newUrl.searchParams.set('batch', b);
  window.history.pushState({}, '', newUrl);
  loadList();
}

async function loadList() {
  const batchSel = document.getElementById("batch-select");
  if (batchSel) batchSel.value = currentBatch;
  
  images = await fetch(`/api/testocr/images?batch=${currentBatch}`).then(r => r.json());
  
  try {
    const clsRes = await fetch(`/api/testocr/batch_classes?batch=${currentBatch}`).then(r => r.json());
    imageClassMap = clsRes || {};
  } catch(e) {
    imageClassMap = {};
  }

  const skipElec = document.getElementById("skip-elec")?.checked;
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";
  
  images.forEach((name, i) => {
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;";
    wrap.id = "thumb-wrap-" + i;

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = `/api/testocr/image/${encodeURIComponent(name)}?batch=${currentBatch}`;
    img.onclick = () => selectImage(i);
    wrap.appendChild(img);

    const dot = document.createElement("div");
    dot.id = "eval-dot-" + i;
    dot.style.cssText = "display:none; position:absolute; top:4px; right:4px; width:10px; height:10px; border-radius:50%; background:#37c978; border:1px solid #0f1216;";
    wrap.appendChild(dot);

    const isElec = imageClassMap[name] === 1;
    if (isElec) {
      const elecBadge = document.createElement("div");
      elecBadge.id = "elec-badge-" + i;
      elecBadge.style.cssText = "position:absolute; bottom:4px; right:4px; font-size:10px; background:rgba(0,0,0,0.7); border-radius:3px; padding:1px 3px;";
      elecBadge.textContent = "⚡";
      wrap.appendChild(elecBadge);
      if (skipElec) {
        wrap.style.opacity = "0.3";
      }
    }

    sidebar.appendChild(wrap);
  });

  // Load all saved evals, mark green dots
  try {
    const allEvals = await fetch(`/api/testocr/all_evals?batch=${currentBatch}`).then(r => r.json());
    savedEvals = allEvals || {};
    images.forEach((name, i) => {
      if (savedEvals[name]) {
        const dot = document.getElementById("eval-dot-" + i);
        if (dot) dot.style.display = "block";
      }
    });
  } catch(e) {}

  let firstIdx = 0;
  if (skipElec) {
    while (firstIdx < images.length && imageClassMap[images[firstIdx]] === 1) {
      firstIdx++;
    }
    if (firstIdx >= images.length) firstIdx = 0;
  }
  if (images.length > 0) selectImage(firstIdx);
}

function onToggleSkipElec() {
  const skipElec = document.getElementById("skip-elec")?.checked;
  images.forEach((name, i) => {
    const wrap = document.getElementById("thumb-wrap-" + i);
    if (!wrap) return;
    const isElec = imageClassMap[name] === 1;
    if (isElec) {
      wrap.style.opacity = skipElec ? "0.3" : "1.0";
    }
  });
  if (skipElec && currentIdx >= 0 && imageClassMap[images[currentIdx]] === 1) {
    nextImage(1);
  }
}

function selectImage(idx) {
  if (idx < 0 || idx >= images.length) return;
  currentIdx = idx;
  document.querySelectorAll(".thumb").forEach((el, i) => {
    el.classList.toggle("active", i === idx);
    if (i === idx) el.scrollIntoView({ block: "nearest" });
  });
  const name = images[idx];
  document.getElementById("result-text").textContent = name;
  document.getElementById("conf-row").innerHTML = "";
  document.getElementById("eval-panel").style.display = "none";

  const cv = document.getElementById("canvas");
  const ctx = cv.getContext("2d");
  currentImgObj = new Image();
  currentImgObj.onload = () => {
    cv.width = currentImgObj.naturalWidth;
    cv.height = currentImgObj.naturalHeight;
    ctx.drawImage(currentImgObj, 0, 0);
    runInference();
  };
  currentImgObj.src = `/api/testocr/image/${encodeURIComponent(name)}?batch=${currentBatch}`;
}

function nextImage(step = 1) {
  let nextIdx = currentIdx + step;
  const skipElec = document.getElementById("skip-elec")?.checked;
  if (skipElec) {
    while (nextIdx >= 0 && nextIdx < images.length && imageClassMap[images[nextIdx]] === 1) {
      nextIdx += (step > 0 ? 1 : -1);
    }
  }
  if (nextIdx >= 0 && nextIdx < images.length) {
    selectImage(nextIdx);
  }
}

function prevImage() {
  nextImage(-1);
}

async function runInference() {
  if (currentIdx < 0) return;
  const name = images[currentIdx];
  document.getElementById("result-text").innerHTML = `<span style="color:#ffb340">⏳ ${name}</span>`;

  try {
    const sliceCount = document.getElementById("slice-count-input").value;
    const res = await fetch(`/api/testocr/infer/${encodeURIComponent(name)}?slice_count=${sliceCount}&batch=${currentBatch}`).then(r => r.json());
    if (res.error) {
      document.getElementById("result-text").innerHTML = `<span style="color:#ff5c5c">❌ ${res.error}</span>`;
      return;
    }

    imageClassMap[name] = res.class_id;
    const skipElec = document.getElementById("skip-elec")?.checked;
    if (skipElec && res.class_id === 1) {
      document.getElementById("result-text").innerHTML =
        `<span style="color:#ffb340">⚡ Công tơ điện tử (Class: 1) — Đã tự động bỏ qua</span>`;
      document.getElementById("eval-panel").style.display = "none";
      const wrap = document.getElementById("thumb-wrap-" + currentIdx);
      if (wrap) wrap.style.opacity = "0.3";
      return;
    }

    const cv = document.getElementById("canvas");
    const ctx = cv.getContext("2d");
    ctx.drawImage(currentImgObj, 0, 0);

    // OBB
    ctx.strokeStyle = "#4da3ff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    const pts = res.quad;
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.stroke();

    let finalStr = "";
    let confHtml = "";
    let cardsHtml = "";

    currentInferDigits = res.digits || [];

    res.digits.forEach((d, i) => {
      if (d.is_decimal && !finalStr.includes(".")) {
        finalStr += ".";
      }
      finalStr += d.char;

      if (d.box_orig) {
        ctx.strokeStyle = d.is_decimal ? "#ff5c5c" : "#ff4da3";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(d.box_orig[0][0], d.box_orig[0][1]);
        for (let j = 1; j < 4; j++) ctx.lineTo(d.box_orig[j][0], d.box_orig[j][1]);
        ctx.closePath();
        ctx.stroke();
        ctx.fillStyle = d.is_decimal ? "#ff5c5c" : "#ff4da3";
        ctx.font = "bold 22px Arial";
        ctx.fillText((d.is_decimal ? "." : "") + d.char, d.box_orig[0][0], d.box_orig[0][1] - 4);
      }

      if (d.ocr_conf !== undefined) {
        const bc = (d.conf * 100).toFixed(1);
        const oc = (d.ocr_conf * 100).toFixed(1);
        let midTag = "";
        if (d.is_mid_roll && d.mid_roll_info) {
          midTag = `<span style="color:#ffb340;font-size:10px;font-weight:bold;margin-left:4px;">⚠️ Mid-roll (${d.mid_roll_info.top1}↔${d.mid_roll_info.top2})</span>`;
        }
        let decTag = d.is_decimal ? `<span style="background:#4a1515;color:#ff5c5c;font-size:10px;font-weight:bold;padding:1px 4px;border-radius:3px;margin-left:4px;">🔴 Số đỏ</span>` : "";

        confHtml += `<span style="background:#1e252e;padding:2px 6px;border-radius:4px;border:1px solid ${d.is_decimal ? '#ff5c5c' : (d.is_mid_roll ? '#ffb340' : '#2a333f')};">
          <b style="color:${d.is_decimal ? '#ff5c5c' : (d.is_mid_roll ? '#ffb340' : '#4da3ff')}">${d.char}</b>
          <span style="color:#8b98a8;font-size:11px"> B:${bc}% O:${oc}%</span>${decTag}${midTag}
        </span>`;
      }

      const isMid = d.is_mid_roll ? "checked" : "";
      const isDec = d.is_decimal ? "checked" : "";
      const midInfoBadge = (d.is_mid_roll && d.mid_roll_info) 
        ? `<div style="color:#ffb340;font-size:9px;margin-top:1px;font-weight:bold;">⚠️ Roll (${d.mid_roll_info.top1}↔${d.mid_roll_info.top2})</div>` 
        : "";

      cardsHtml += `
        <div class="digit-card" id="card-${i}" style="${d.is_decimal ? 'border-color:#ff7b7b;' : (d.is_mid_roll ? 'border-color:#ffb340;' : '#3c495a')}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; font-size:10px;">
            <span style="color:#8b98a8;">#${i+1}</span>
            <span id="char-match-${i}" style="font-weight:bold; color:#37c978;">✓ Đúng</span>
          </div>

          <div class="pred" id="pred-disp-${i}" style="${d.is_decimal ? 'color:#ff5c5c;' : (d.is_mid_roll ? 'color:#ffb340;' : '#4da3ff')}">${d.char}</div>
          ${midInfoBadge}

          <input type="text" id="actual-digit-${i}" value="${d.char}" title="Nhập số thực tế" oninput="updateDigitCardStatus(${i})" style="${d.is_decimal ? 'color:#ff5c5c;font-weight:bold;' : ''}">

          <!-- Đánh giá Số Đỏ (is_decimal) -->
          <div style="margin-top:5px; padding:3px 4px; background:#161b22; border-radius:4px; font-size:10px; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:#8b98a8;">Đỏ: <b style="color:${d.is_decimal ? '#ff5c5c' : '#8b98a8'}">${d.is_decimal ? 'Có' : 'Ko'}</b> (${(d.dec_prob*100).toFixed(0)}%)</span>
              <span id="dec-match-${i}" style="font-weight:bold; color:#37c978;">✓ Đúng</span>
            </div>
            <label style="color:#ff7b7b; display:flex; align-items:center; gap:3px; margin:2px 0 0 0; font-size:10px; cursor:pointer;">
              <input type="checkbox" id="decimal-digit-${i}" ${isDec} onchange="updateDigitCardStatus(${i})"> 🔴 Thực tế Đỏ
            </label>
          </div>

          <!-- Đánh giá Mid-roll (is_mid_roll) -->
          <div style="margin-top:3px; padding:3px 4px; background:#161b22; border-radius:4px; font-size:10px; text-align:left;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:#8b98a8;">Half: <b style="color:${d.is_mid_roll ? '#ffb340' : '#8b98a8'}">${d.is_mid_roll ? 'Có' : 'Ko'}</b> (${(d.half_prob*100).toFixed(0)}%)</span>
              <span id="half-match-${i}" style="font-weight:bold; color:#37c978;">✓ Đúng</span>
            </div>
            <label style="color:#ffb340; display:flex; align-items:center; gap:3px; margin:2px 0 0 0; font-size:10px; cursor:pointer;">
              <input type="checkbox" id="half-digit-${i}" ${isMid} onchange="updateDigitCardStatus(${i})"> ⚠️ Thực tế Half
            </label>
          </div>

          <label style="color:#8b98a8; margin-top:3px; font-size:10px; display:flex; align-items:center; gap:2px; justify-content:center;">
            <input type="checkbox" id="spurious-${i}" onchange="toggleSpurious(${i}); updateDigitCardStatus(${i});"> ❌ Thừa
          </label>
        </div>`;
    });

    document.getElementById("result-text").innerHTML =
      `<span style="color:#37c978">✅ ${finalStr}</span> <span style="color:#8b98a8;font-size:11px">(Class: ${res.class_id})</span>`;
    document.getElementById("conf-row").innerHTML = confHtml;
    document.getElementById("digit-eval-container").innerHTML = cardsHtml;
    document.getElementById("detected-count").textContent = res.digits.length;
    document.getElementById("eval-digits").checked = true;
    document.getElementById("bbox-miss-panel").style.display = "none";
    document.getElementById("eval-panel").style.display = "flex";
    document.getElementById("eval-panel").style.flexDirection = "column";
    document.getElementById("eval-status").textContent = "";

    // Live update statuses
    res.digits.forEach((_, i) => updateDigitCardStatus(i));
    updateLiveSummary();

    // Populate saved eval if exists
    populateSavedEval(images[currentIdx]);

  } catch (e) {
    document.getElementById("result-text").innerHTML = `<span style="color:#ff5c5c">❌ ${e}</span>`;
  }
}

async function saveEvaluation() {
  if (currentIdx < 0) return;
  const name = images[currentIdx];
  const statusEl = document.getElementById("eval-status");
  statusEl.style.color = "#ffb340";
  statusEl.textContent = "Đang lưu...";

  const type = document.querySelector('input[name="eval-type"]:checked').value;
  const obb = document.getElementById("eval-obb").checked;
  const digits_bbox_correct = document.getElementById("eval-digits").checked;

  const digit_details = [];
  let actual_text = "";
  document.querySelectorAll('[id^="actual-digit-"]').forEach((el, i) => {
    const actual = el.value.trim();
    const d = (currentInferDigits && currentInferDigits[i]) ? currentInferDigits[i] : {};
    const is_half = document.getElementById("half-digit-" + i)?.checked || false;
    const is_spurious = document.getElementById("spurious-" + i)?.checked || false;
    const is_decimal = document.getElementById("decimal-digit-" + i)?.checked || false;

    if (!is_spurious) {
      if (is_decimal && !actual_text.includes(".")) actual_text += ".";
      actual_text += actual;
    }

    digit_details.push({
      actual,
      pred: d.char || "",
      pred_conf: d.ocr_conf || 0.0,
      char_correct: (actual === d.char),

      is_decimal,
      pred_is_decimal: !!d.is_decimal,
      dec_prob: d.dec_prob || 0.0,
      decimal_correct: (is_decimal === !!d.is_decimal),

      is_half,
      pred_is_half: !!d.is_mid_roll,
      half_prob: d.half_prob || 0.0,
      half_correct: (is_half === !!d.is_mid_roll),

      is_spurious
    });
  });

  const bbox_miss_reason = digits_bbox_correct ? null : (document.querySelector('input[name="miss-reason"]:checked')?.value || null);
  const expected_digit_count = digits_bbox_correct ? null : parseInt(document.getElementById("expected-digit-count").value);

  try {
    const res = await fetch(`/api/testocr/evaluate/${encodeURIComponent(name)}?batch=${currentBatch}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, obb, digits_bbox_correct, actual_text, digit_details, bbox_miss_reason, expected_digit_count })
    }).then(r => r.json());

    if (res.ok) {
      // Update local cache + mark dot
      savedEvals[name] = { type, obb, digits_bbox_correct, actual_text, digit_details, bbox_miss_reason, expected_digit_count };
      const dot = document.getElementById("eval-dot-" + currentIdx);
      if (dot) dot.style.display = "block";
      statusEl.style.color = "#37c978";
      statusEl.textContent = "✔️ Đã lưu!";
      setTimeout(() => nextImage(), 600);
    } else {
      statusEl.style.color = "#ff5c5c";
      statusEl.textContent = "❌ " + (res.error || "Lỗi");
    }
  } catch (e) {
    statusEl.style.color = "#ff5c5c";
    statusEl.textContent = "❌ " + e;
  }
}



function populateSavedEval(name) {
  const ev = savedEvals[name];
  if (!ev) {
    document.getElementById("eval-status").textContent = "";
    document.getElementById("eval-status").style.color = "#8b98a8";
    return;
  }

  // Show indicator
  document.getElementById("eval-status").style.color = "#37c978";
  document.getElementById("eval-status").textContent = "✔️ Đã có đánh giá — đang hiển thị";

  // Meter type
  const typeEl = document.querySelector(`input[name="eval-type"][value="${ev.type}"]`);
  if (typeEl) typeEl.checked = true;

  // OBB
  if (ev.obb !== undefined) document.getElementById("eval-obb").checked = ev.obb;

  // BBox
  if (ev.digits_bbox_correct !== undefined) {
    document.getElementById("eval-digits").checked = ev.digits_bbox_correct;
    document.getElementById("bbox-miss-panel").style.display = ev.digits_bbox_correct ? "none" : "block";
    if (!ev.digits_bbox_correct && ev.bbox_miss_reason) {
      const r = document.querySelector(`input[name="miss-reason"][value="${ev.bbox_miss_reason}"]`);
      if (r) r.checked = true;
    }
    if (ev.expected_digit_count) document.getElementById("expected-digit-count").value = ev.expected_digit_count;
  }

  // Per-digit details
  if (ev.digit_details) {
    ev.digit_details.forEach((d, i) => {
      const inp = document.getElementById("actual-digit-" + i);
      if (inp && d.actual !== undefined) inp.value = d.actual;
      const half = document.getElementById("half-digit-" + i);
      if (half) half.checked = !!d.is_half;
      const dec = document.getElementById("decimal-digit-" + i);
      if (dec && d.is_decimal !== undefined) dec.checked = !!d.is_decimal;
      const spurious = document.getElementById("spurious-" + i);
      if (spurious) {
        spurious.checked = !!d.is_spurious;
        if (d.is_spurious) toggleSpurious(i);
      }
    });
  }

  if (currentInferDigits) {
    currentInferDigits.forEach((_, i) => updateDigitCardStatus(i));
    updateLiveSummary();
  }
}

function updateDigitCardStatus(i) {
  if (!currentInferDigits || !currentInferDigits[i]) return;
  const d = currentInferDigits[i];
  const actualVal = document.getElementById("actual-digit-" + i)?.value?.trim();
  const isDec = document.getElementById("decimal-digit-" + i)?.checked;
  const isHalf = document.getElementById("half-digit-" + i)?.checked;
  const isSpurious = document.getElementById("spurious-" + i)?.checked;

  const card = document.getElementById("card-" + i);
  if (!card) return;
  if (isSpurious) {
    card.style.opacity = "0.35";
    card.style.borderColor = "#ff5c5c";
    return;
  }
  card.style.opacity = "1";

  // Check char
  const charCorrect = (actualVal === d.char);
  const charEl = document.getElementById("char-match-" + i);
  if (charEl) {
    charEl.innerHTML = charCorrect ? `<span style="color:#37c978;">✓ Đúng</span>` : `<span style="color:#ff5c5c;">✗ Sai</span>`;
  }

  // Check decimal
  const decCorrect = (isDec === !!d.is_decimal);
  const decEl = document.getElementById("dec-match-" + i);
  if (decEl) {
    decEl.innerHTML = decCorrect ? `<span style="color:#37c978;">✓ Đúng</span>` : `<span style="color:#ff5c5c;">✗ Sai</span>`;
  }

  // Check half
  const halfCorrect = (isHalf === !!d.is_mid_roll);
  const halfEl = document.getElementById("half-match-" + i);
  if (halfEl) {
    halfEl.innerHTML = halfCorrect ? `<span style="color:#37c978;">✓ Đúng</span>` : `<span style="color:#ff5c5c;">✗ Sai</span>`;
  }

  // Border color highlight if any error
  const allCorrect = charCorrect && decCorrect && halfCorrect;
  if (!allCorrect) {
    card.style.borderColor = "#ff5c5c";
    card.style.boxShadow = "0 0 6px rgba(255, 92, 92, 0.35)";
  } else {
    card.style.borderColor = isDec ? "#ff7b7b" : (isHalf ? "#ffb340" : "#3c495a");
    card.style.boxShadow = "none";
  }

  updateLiveSummary();
}

function updateLiveSummary() {
  if (!currentInferDigits || currentInferDigits.length === 0) return;
  let tot = 0, cChar = 0, cDec = 0, cHalf = 0;
  currentInferDigits.forEach((d, i) => {
    const isSpurious = document.getElementById("spurious-" + i)?.checked;
    if (isSpurious) return;
    tot++;
    const actualVal = document.getElementById("actual-digit-" + i)?.value?.trim();
    const isDec = document.getElementById("decimal-digit-" + i)?.checked;
    const isHalf = document.getElementById("half-digit-" + i)?.checked;

    if (actualVal === d.char) cChar++;
    if (isDec === !!d.is_decimal) cDec++;
    if (isHalf === !!d.is_mid_roll) cHalf++;
  });

  const sumEl = document.getElementById("live-eval-summary");
  if (sumEl && tot > 0) {
    const charColor = (cChar === tot) ? "#37c978" : "#ffb340";
    const decColor = (cDec === tot) ? "#37c978" : "#ffb340";
    const halfColor = (cHalf === tot) ? "#37c978" : "#ffb340";
    sumEl.innerHTML = `Số: <b style="color:${charColor}">${cChar}/${tot}</b> | Đỏ: <b style="color:${decColor}">${cDec}/${tot}</b> | Half: <b style="color:${halfColor}">${cHalf}/${tot}</b>`;
  }
}

async function showBatchStats() {
  const modal = document.getElementById("stats-modal");
  const body = document.getElementById("stats-modal-body");
  modal.style.display = "flex";
  body.innerHTML = "<div style='text-align:center; padding:20px; color:#ffb340;'>⏳ Đang tính toán thống kê...</div>";

  try {
    const s = await fetch(`/api/testocr/batch_stats?batch=${currentBatch}`).then(r => r.json());
    if (!s || s.total_images === 0) {
      body.innerHTML = "<div style='text-align:center; padding:20px; color:#8b98a8;'>Chưa có ảnh nào được đánh giá trong Batch này!</div>";
      return;
    }

    body.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
        <div style="background:#1e252e; border:1px solid #2a333f; padding:10px; border-radius:6px; text-align:center;">
          <div style="color:#8b98a8; font-size:12px;">Số ảnh đã đánh giá</div>
          <div style="font-size:24px; font-weight:bold; color:#4da3ff;">${s.total_images}</div>
        </div>
        <div style="background:#1e252e; border:1px solid #2a333f; padding:10px; border-radius:6px; text-align:center;">
          <div style="color:#8b98a8; font-size:12px;">Độ chính xác Ký tự (Acc)</div>
          <div style="font-size:24px; font-weight:bold; color:${s.digit_accuracy >= 95 ? '#37c978' : '#ffb340'};">${s.digit_accuracy}%</div>
          <div style="font-size:11px; color:#8b98a8;">(${s.digit_correct}/${s.digit_total} ký tự)</div>
        </div>
      </div>

      <!-- Thống kê Số đỏ -->
      <div style="background:#1e252e; border:1px solid #3c495a; padding:10px; border-radius:6px; margin-bottom:10px;">
        <b style="color:#ff7b7b; display:block; margin-bottom:6px; font-size:13px;">🔴 Phân loại Số đỏ (is_decimal)</b>
        <div style="display:flex; justify-content:space-between; font-size:12px;">
          <span>Accuracy: <b>${s.decimal.acc}%</b></span>
          <span>Precision: <b>${s.decimal.precision}%</b></span>
          <span>Recall: <b>${s.decimal.recall}%</b></span>
          <span>F1-Score: <b style="color:#37c978;">${s.decimal.f1}%</b></span>
        </div>
        <div style="font-size:11px; color:#8b98a8; margin-top:4px;">
          TP: ${s.decimal.tp} | FP: ${s.decimal.fp} | FN: ${s.decimal.fn} | TN: ${s.decimal.tn}
        </div>
      </div>

      <!-- Thống kê Mid-roll -->
      <div style="background:#1e252e; border:1px solid #3c495a; padding:10px; border-radius:6px; margin-bottom:14px;">
        <b style="color:#ffb340; display:block; margin-bottom:6px; font-size:13px;">⚠️ Phân loại Mid-roll (is_mid_roll)</b>
        <div style="display:flex; justify-content:space-between; font-size:12px;">
          <span>Accuracy: <b>${s.half.acc}%</b></span>
          <span>Precision: <b>${s.half.precision}%</b></span>
          <span>Recall: <b>${s.half.recall}%</b></span>
          <span>F1-Score: <b style="color:#37c978;">${s.half.f1}%</b></span>
        </div>
        <div style="font-size:11px; color:#8b98a8; margin-top:4px;">
          TP: ${s.half.tp} | FP: ${s.half.fp} | FN: ${s.half.fn} | TN: ${s.half.tn}
        </div>
      </div>

      <!-- Mismatches list -->
      <div>
        <b style="color:#8b98a8; font-size:12px;">Danh sách ảnh có ô đoán lệch (${s.mismatches.length} ảnh):</b>
        <div style="display:flex; flex-wrap:wrap; gap:4px; max-height:100px; overflow-y:auto; margin-top:6px;">
          ${s.mismatches.length === 0 ? '<span style="color:#37c978; font-size:12px;">Không có ca nào đoán sai! 🎉</span>' : 
            s.mismatches.map(name => {
              const idx = images.indexOf(name);
              return `<button onclick="closeStatsModal(); selectImage(${idx});" style="font-size:11px; padding:3px 6px; background:#2a333f; color:#ffb340;">${name.slice(0, 15)}...</button>`;
            }).join('')
          }
        </div>
      </div>
    `;
  } catch (e) {
    body.innerHTML = `<div style="color:#ff5c5c;">Lỗi tải thống kê: ${e}</div>`;
  }
}

function closeStatsModal() {
  document.getElementById("stats-modal").style.display = "none";
}

function toggleBboxMiss() {
  const checked = document.getElementById("eval-digits").checked;
  document.getElementById("bbox-miss-panel").style.display = checked ? "none" : "block";
}

function toggleSpurious(i) {
  const card = document.getElementById("card-" + i);
  const checked = document.getElementById("spurious-" + i).checked;
  card.style.opacity = checked ? "0.35" : "1";
  card.style.border = checked ? "1px solid #ff5c5c" : "1px solid #3c495a";
  card.style.background = checked ? "#3a1a1a" : "#2a333f";
}

function clearResults() {
  if (!currentImgObj) return;
  const cv = document.getElementById("canvas");
  const ctx = cv.getContext("2d");
  cv.width = currentImgObj.naturalWidth;
  cv.height = currentImgObj.naturalHeight;
  ctx.drawImage(currentImgObj, 0, 0);
  document.getElementById("result-text").style.color = "var(--accent)";
  document.getElementById("result-text").textContent = images[currentIdx] || "—";
  document.getElementById("conf-row").innerHTML = "";
  document.getElementById("eval-panel").style.display = "none";
}

async function clearBatchEvals() {
  if (!confirm(`Bạn có chắc muốn XÓA TOÀN BỘ đánh giá đã lưu của Validate ${currentBatch}? (Dữ liệu cũ đã được tự động lưu dự phòng)`)) {
    return;
  }
  try {
    const res = await fetch(`/api/testocr/clear_evals`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ batch: currentBatch })
    }).then(r => r.json());
    if (res.ok) {
      alert(res.message || "Đã xóa đánh giá cũ thành công!");
      savedEvals = {};
      document.querySelectorAll("[id^='eval-dot-']").forEach(dot => dot.style.display = "none");
      document.getElementById("eval-status").textContent = "";
      selectImage(currentIdx);
    }
  } catch (e) {
    alert("Lỗi khi xóa: " + e);
  }
}

loadList();
</script>
